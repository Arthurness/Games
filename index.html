<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Automated GitHub Arcade</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(to right, #38bdf8, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #94a3b8;
            font-size: 1.1rem;
            margin: 0;
        }

        .menu-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            width: 90%;
            max-width: 900px;
            justify-content: center;
        }

        .play-btn {
            text-align: center;
            text-decoration: none;
            padding: 25px 20px;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffffff;
            background-color: #1e293b;
            border: 2px solid #334155;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s, background-color 0.2s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-transform: capitalize;
        }

        .play-btn:hover {
            transform: translateY(-4px);
            border-color: #a855f7;
            background-color: #2e3b52;
            box-shadow: 0 10px 15px rgba(168, 85, 247, 0.3);
        }

        .btn-icon {
            font-size: 2rem;
        }

        .loading {
            color: #64748b;
            font-style: italic;
        }
    </style>
</head>
<body>

    <header>
        <h1>Web Arcade Hub</h1>
        <p>Choose a game to play instantly</p>
    </header>

    <main class="menu-container" id="arcade-menu">
        <p class="loading">Scanning for available arcade titles...</p>
    </main>

    <script>
        // ==========================================
        // 🛠️ CONFIGURATION - CHANGE THESE LINES!
        // ==========================================
        const GITHUB_USERNAME = "Arthurness"; 
        const REPO_NAME = "Games";
        // ==========================================

        // Map game filenames to decorative visual emojis
        const emojiMap = {
            "puzzle": "🏓", // Your puzzle file renamed to Pong in dashboard
            "frogfriends": "🐸",
            "bloxd": "🧱",
            "fish": "🎣",
            "eaglercraft": "🟩"
        };

        async function loadArcadeGames() {
            const menu = document.getElementById('arcade-menu');
            // Fetch content metadata directory via Public GitHub Repository API
            const apiURL = `https://github.com{GITHUB_USERNAME}/${REPO_NAME}/contents/games`;

            try {
                const response = await fetch(apiURL);
                if (!response.ok) throw new Error("Could not access files");
                
                const files = await response.json();
                
                // Empty the placeholder text
                menu.innerHTML = "";

                // Loop over everything found inside /games folder
                files.forEach(file => {
                    // Only process standard HTML files
                    if (file.name.endsWith('.html')) {
                        const filenameClean = file.name.replace('.html', '');
                        
                        // Human-friendly title transformation (e.g. frogfriends -> frog friends)
                        let displayName = filenameClean.replace(/[-_]/g, ' ');
                        if (displayName.toLowerCase() === "puzzle") displayName = "Pong"; // Handle custom title override

                        // Look up mapped icon or default to standard gamepad emoji
                        const icon = emojiMap[filenameClean] || "🎮";

                        // Create custom play link component
                        const card = document.createElement('a');
                        card.href = `./games/${file.name}`;
                        card.className = "play-btn";
                        card.innerHTML = `<span class="btn-icon">${icon}</span> ${displayName}`;
                        
                        menu.appendChild(card);
                    }
                });

                if(menu.innerHTML === "") {
                    menu.innerHTML = "<p class='loading'>No HTML files found in games/ directory.</p>";
                }

            } catch (error) {
                console.error(error);
                menu.innerHTML = "<p class='loading' style='color:#ef4444;'>Failed to auto-detect games. Double-check username/repo configuration configurations inside code variables.</p>";
            }
        }

        // Trigger scan once DOM container is initialized
        document.addEventListener('DOMContentLoaded', loadArcadeGames);
    </script>

</body>
</html>
