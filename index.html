<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Arcade</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f4f4f9; }
        .game-link { display: block; margin: 8px 0; font-size: 18px; color: #0066cc; text-decoration: none; }
        .game-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1>🎮 My Games</h1>
    <div id="game-list">If u see this U are cool...</div>

    <script>
        // Fetches a file list generated by our GitHub script
        fetch('./games-list.json')
            .then(res => res.json())
            .then(games => {
                const container = document.getElementById('game-list');
                container.innerHTML = '';
                
                if(games.length === 0) {
                    container.innerHTML = 'No games found.';
                    return;
                }

                games.forEach(file => {
                    const a = document.createElement('a');
                    // Format the display name (e.g., "my-game.html" -> "My Game")
                    const displayName = file.replace('.html', '').replace(/-/g, ' ');
                    
                    a.href = `./games/${file}`;
                    a.className = 'game-link';
                    a.textContent = displayName.toUpperCase();
                    container.appendChild(a);
                });
            })
            .catch(() => {
                document.getElementById('game-list').textContent = 'Failed to load game directory.';
            });
    </script>
</body>
</html>
